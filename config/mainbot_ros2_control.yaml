controller_manager:
  ros__parameters:
    update_rate: 50
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    mainbot_base_controller:
      type: mecanum_drive_controller/MecanumDriveController

mainbot_base_controller:
  ros__parameters:
    use_sim_time: true
    
    # 1. KHỚP ĐIỀU KHIỂN (Command Joints) - Bắt buộc
    front_left_wheel_command_joint_name: "robot_front_left_wheel_joint"
    front_right_wheel_command_joint_name: "robot_front_right_wheel_joint"
    rear_left_wheel_command_joint_name: "robot_back_left_wheel_joint"
    rear_right_wheel_command_joint_name: "robot_back_right_wheel_joint"

    # 2. KHỚP TRẠNG THÁI (State Joints) - Tránh lỗi thiếu frame
    front_left_wheel_state_joint_name: "robot_front_left_wheel_joint"
    front_right_wheel_state_joint_name: "robot_front_right_wheel_joint"
    rear_left_wheel_state_joint_name: "robot_back_left_wheel_joint"
    rear_right_wheel_state_joint_name: "robot_back_right_wheel_joint"

    # 3. HỆ QUY CHIẾU TF
    base_frame_id: "robot_base_footprint"
    odom_frame_id: "odom"
    enable_odom_tf: true

    # 4. THÔNG SỐ ĐỘNG HỌC (Cấu trúc Dictionary bắt buộc)
    kinematics:
      base_frame_offset:
        x: 0.0
        y: 0.0
        theta: 0.0
      wheels_radius: 0.08
      sum_of_robot_center_projection_on_X_Y_axis: 0.43
    
    # 5. COVARIANCE (Ép phẳng 2D)
    twist_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.01]
    pose_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.01]