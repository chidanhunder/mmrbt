amcl:
  ros__parameters:
    use_sim_time: True
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "robot_base_footprint"
    global_frame_id: "map"
    odom_frame_id: "odom"
    max_particles: 2000
    min_particles: 500
    robot_model_type: "OmniMotionModel" # Tối ưu cho xe đa hướng Mecanum
    scan_topic: scan
    transform_tolerance: 1.0

bt_navigator:
  ros__parameters:
    use_sim_time: True
    vel_topic: "/cmd_vel" # <--- SỬA LẠI: Trỏ thẳng về topic cầu nối Gazebo
    global_frame: map
    robot_base_frame: robot_base_footprint
    odom_topic: "/odom"   # <--- SỬA LẠI: Trỏ thẳng về topic cầu nối Gazebo
    bt_loop_duration: 10
    default_server_timeout: 20
    # Sử dụng cây hành vi mặc định cho điều hướng tới điểm
    #default_nav_to_pose_bt_xml: "replace_with_default_path_if_needed/navigate_to_pose_w_replanning_and_recovery.xml"

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    
    # 1. BỔ SUNG KHAI BÁO CÁC PLUGIN BẮT BUỘC NÀY
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # Cấu hình cho Progress Checker
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    # Cấu hình cho Goal Checker
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: True
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      # 2. BỔ SUNG DANH SÁCH CRITICS (BẮT BUỘC CỦA DWB)
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      
      # (Các cấu hình bên dưới của bạn giữ nguyên)
      debug_trajectory_details: True
      min_vel_x: -0.5
      min_vel_y: -0.45 
      max_vel_x: 0.5
      max_vel_y: 0.45  
      max_vel_theta: 1.0
      min_speed_xy: 0.0
      max_speed_xy: 0.5
      min_speed_theta: 0.0
      acc_lim_x: 1.5
      acc_lim_y: 1.5
      acc_lim_theta: 2.0
      decel_lim_x: -1.5
      decel_lim_y: -1.5
      decel_lim_theta: -2.0
      vx_samples: 20
      vy_samples: 20    
      vtheta_samples: 20
      syndata_display: 10
      holonomic_robot: True 
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      
      # Trọng số nội tại của DWB
      BaseObstacle:
        scale: 0.02
      PathAlign:
        scale: 32.0
      GoalAlign:
        scale: 24.0
      PathDist:
        scale: 32.0
      GoalDist:
        scale: 24.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: robot_base_footprint
      use_sim_time: True
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # Kích thước base là 450x400 mm, nên lấy footprint dư ra 5cm cho an toàn
      footprint: "[ [0.225, 0.20], [0.225, -0.20], [-0.225, -0.20], [-0.225, 0.20] ]"
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 10.0 # Tầm nhìn tối đa của LiDAR là 10.0m
          raytrace_min_range: 0.12 # Tầm nhìn tối thiểu của LiDAR là 0.12m
          obstacle_max_range: 9.5

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: robot_base_footprint
      use_sim_time: True
      # Kích thước base là 450x400 mm, nên lấy footprint dư ra 5cm cho an toàn
      footprint: "[ [0.225, 0.20], [0.225, -0.20], [-0.225, -0.20], [-0.225, 0.20] ]"
      resolution: 0.05
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 10.0 # Tầm nhìn tối đa của LiDAR là 10.0m
          raytrace_min_range: 0.12 # Tầm nhìn tối thiểu của LiDAR là 0.12m
          obstacle_max_range: 9.5
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

planner_server:
  ros__parameters:
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: True
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    global_frame: map
    robot_base_frame: robot_base_footprint
    transform_tolerance: 0.1

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200
velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.5, 0.45, 1.0]  # Tương ứng với [v_x, v_y, v_theta] tối đa ở trên
    min_velocity: [-0.5, -0.45, -1.0]
    max_accel: [1.2, 1.2, 2.0]      # Ép gia tốc thấp hơn một chút so với DWB để làm mượt
    max_decel: [-1.2, -1.2, -2.0]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
collision_monitor:
  ros__parameters:
    use_sim_time: True
    base_frame_id: "robot_base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    transform_tolerance: 0.5
    source_timeout: 5.0
    stop_pub_timeout: 2.0
    # Cấu hình vùng an toàn (dừng lại nếu có vật cản gần 0.3m)
    polygons: ["PolygonStop"]
    PolygonStop:
      type: "polygon"
      points: "[ [0.3, 0.3], [0.3, -0.3], [-0.3, -0.3], [-0.3, 0.3] ]"
      action_type: "stop"
      min_points: 4
      visualize: True
      polygon_pub_topic: "polygon_stop"
    # KHAI BÁO NGUỒN QUAN SÁT ĐỂ KHẮC PHỤC LỖI
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan"